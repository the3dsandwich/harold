# Harold — personal assistant notification framework
#
# Usage:
#   cp .env.example .env   # fill in your tokens and location
#   docker compose up -d

services:
  harold:
    image: ${IMAGE:-harold}
    container_name: harold
    build:
      context: .
      dockerfile: docker/Containerfile
    env_file: .env
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - STATE_DIR=${STATE_DIR:-/data/state}
    ports:
      - "${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}"
    volumes:
      - state:${STATE_DIR:-/data/state}
    labels:
      - com.centurylinklabs.watchtower.enable=true
      - com.centurylinklabs.watchtower.scope=harold
    restart: unless-stopped


  watchtower:
    image: nickfedor/watchtower:1.24.0
    container_name: watchtower-harold
    environment:
      - TZ=${TZ:-Asia/Taipei}
      - WATCHTOWER_SCOPE=harold
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_POLL_INTERVAL=60
    labels:
      - com.centurylinklabs.watchtower.scope=harold
      - com.centurylinklabs.watchtower.enable=false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

volumes:
  state:
