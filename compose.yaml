x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  harold:
    logging: *default-logging
    image: ${IMAGE:-harold}
    container_name: harold
    build:
      context: .
      dockerfile: docker/Containerfile
    env_file: .env
    environment:
    - TZ=${TZ:-Asia/Taipei}
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - STATE_DIR=${STATE_DIR:-/data/state}
    ports:
    - ${DASHBOARD_PORT:-8080}:${DASHBOARD_PORT:-8080}
    volumes:
    - type: bind
      source: ${APP_DATA_ROOT:?Set APP_DATA_ROOT}/state
      target: ${STATE_DIR:-/data/state}
      bind:
        create_host_path: false
    labels:
    - com.centurylinklabs.watchtower.enable=true
    - com.centurylinklabs.watchtower.scope=harold
    restart: unless-stopped
  watchtower:
    logging: *default-logging
    image: nickfedor/watchtower:1.24.0
    container_name: watchtower-harold
    environment:
    - TZ=${TZ:-Asia/Taipei}
    - WATCHTOWER_SCOPE=harold
    - WATCHTOWER_LABEL_ENABLE=true
    - WATCHTOWER_CLEANUP=true
    - WATCHTOWER_POLL_INTERVAL=60
    labels:
    - com.centurylinklabs.watchtower.scope=harold
    - com.centurylinklabs.watchtower.enable=false
    volumes:
    - type: bind
      source: ${DOCKER_SOCKET_PATH:-/var/run/docker.sock}
      target: /var/run/docker.sock
      bind:
        create_host_path: false
    restart: unless-stopped
name: harold
